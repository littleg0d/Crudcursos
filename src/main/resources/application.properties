spring.application.name=alumnos

spring.datasource.url=jdbc:postgresql://127.0.0.1:${DB_PORT}/alumnos_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT}:5432

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires
springdoc.swagger-ui.operations-sorter=method
